<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Things — Lauren Wooyoung Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #fff;
    color: #0a0a0a;
    font-family: "Fragment Mono", monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }
  body {
    padding: 2.4rem 2.6rem;
  }
  a { color: inherit; text-decoration: none; }

  /* ── Gate ── */
  #gate {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #fff;
    z-index: 100;
  }
  #gate input {
    font-family: "Fragment Mono", monospace;
    font-size: 16px; /* 16px prevents iOS auto-zoom on focus */
    letter-spacing: 0.1em;
    border: none;
    border-bottom: 1px solid #0a0a0a;
    outline: none;
    padding: 0.4rem 0;
    width: 160px;
    text-align: center;
    background: transparent;
    color: #0a0a0a;
    -webkit-appearance: none;
    border-radius: 0;
  }
  #gate input::placeholder { opacity: 0.3; }
  #gate-error {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0;
    margin-top: 1rem;
    transition: opacity 0.2s;
  }
  #gate-error.visible { opacity: 0.4; }

  /* ── Content ── */
  #content { display: none; }
  #content.visible { display: block; }

  .corner-nav {
    position: fixed;
    top: 2.4rem;
    right: 2.6rem;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.3rem;
  }
  .corner-nav a {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: opacity 0.2s;
  }
  .corner-nav a:hover { opacity: 0.35; }

  main {
    padding-bottom: 4rem;
  }

  .back {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: #0a0a0a;
    opacity: 0.35;
    transition: opacity 0.2s;
    display: block;
    margin-bottom: 2rem;
  }
  .back:hover { opacity: 1; }

  .things-list {
    display: flex;
    flex-direction: column;
    gap: 2.4rem;
  }

  .thing {
    font-size: 11px;
    letter-spacing: 0.1em;
    line-height: 1.7;
    text-transform: uppercase;
  }

  .thing-link {
    opacity: 0.35;
    transition: opacity 0.2s;
    word-break: break-all;
  }
  .thing-link:hover { opacity: 1; }

  /* ── Desktop: show the phone layout, scaled up as one picture (402×674 phone) ── */
  @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
    :root { --u: calc(100vh / 674); }
    html { background: #fff; }
    body { max-width: calc(402 * var(--u)); margin: 0 auto; padding: calc(38.4 * var(--u)) calc(41.6 * var(--u)); }
    .back { font-size: calc(11 * var(--u)); margin-bottom: calc(32 * var(--u)); }
    .thing, .soon { font-size: calc(11 * var(--u)); }
    .things-list { gap: calc(38.4 * var(--u)); }
    #gate input { font-size: calc(16 * var(--u)); width: calc(160 * var(--u)); }
    #gate-error { font-size: calc(10 * var(--u)); }
  }
</style>
</head>
<body>

<div id="gate">
  <input id="pw-input" type="password" placeholder="password" autocomplete="off" autofocus>
  <div id="gate-error">try again</div>
</div>

<div id="content">
  <main>
    <a class="back" href="index.html">← Back</a>
    <div class="things-list" id="things-list"></div>
  </main>
</div>

<script>
  // ── Password: checked on the server by /api/things ──
  const input = document.getElementById("pw-input");
  const gate = document.getElementById("gate");
  const content = document.getElementById("content");
  const error = document.getElementById("gate-error");
  const list = document.getElementById("things-list");

  function showError() {
    error.classList.add("visible");
    input.value = "";
    setTimeout(() => error.classList.remove("visible"), 1500);
  }

  function render(things) {
    list.textContent = "";
    things.forEach(item => {
      const div = document.createElement("div");
      div.className = "thing";
      const note = document.createElement("span");
      note.className = "thing-note";
      note.textContent = item.note + " ";
      const link = document.createElement("a");
      link.className = "thing-link";
      link.href = item.url;
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = item.url;
      div.append(note, link);
      list.appendChild(div);
    });
  }

  let busy = false;
  input.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || busy) return;
    busy = true;
    try {
      const res = await fetch("/api/things", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: input.value })
      });
      if (!res.ok) return showError();
      const data = await res.json();
      render(data.things);
      gate.style.display = "none";
      content.classList.add("visible");
    } catch (err) {
      showError();
    } finally {
      busy = false;
    }
  });
</script>
</body>
</html>
