<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community — Lauren Wooyoung Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #fff;
    color: #0a0a0a;
    font-family: "Fragment Mono", monospace;
    min-height: 100vh;
  }
  body {
    padding: 2.4rem 2.6rem;
  }
  .back {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-decoration: none;
    color: #0a0a0a;
    opacity: 0.35;
    transition: opacity 0.2s;
    display: block;
    margin-bottom: 2rem;
  }
  .back:hover { opacity: 1; }
  .soon {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #0a0a0a;
    opacity: 0.5;
  }

  /* ── Desktop: show the phone layout, scaled up as one picture (402×674 phone) ── */
  @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
    :root { --u: calc(100vh / 674); }
    html { background: #fff; }
    body { max-width: calc(402 * var(--u)); margin: 0 auto; padding: calc(38.4 * var(--u)) calc(41.6 * var(--u)); }
    .back { font-size: calc(11 * var(--u)); margin-bottom: calc(32 * var(--u)); }
    .thing, .soon { font-size: calc(11 * var(--u)); }
    .things-list { gap: calc(38.4 * var(--u)); }
    #gate input { font-size: calc(16 * var(--u)); width: calc(160 * var(--u)); }
    #gate-error { font-size: calc(10 * var(--u)); }
  }
</style>
</head>
<body>
  <a href="index.html" class="back">← Back</a>
  <p class="soon">More Soon.</p>
</body>
</html>
